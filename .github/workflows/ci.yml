name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info in CI's dev/test builds: nothing reads it there, and it
  # costs compile and link time and cache size. Release builds are untouched.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  check:
    name: fmt · clippy · test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the channel and components; rustup installs it
      # on first use.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Each step is one step of scripts/check.sh, the gate contributors run
      # locally (`scripts/check.sh --fix`), so the two can't drift.
      - name: Format
        run: scripts/check.sh fmt

      - name: Clippy
        run: scripts/check.sh clippy

      # Also fails when site/src/generated/ is out of date with the config
      # keys or the keymap (run scripts/gen-docs.sh).
      - name: Test
        run: scripts/check.sh test

      # blyg-app's tests again with every UI string spelled as Windows shows
      # it (Ctrl+B, not ⌘B): a test that expects Mac glyphs fails here, not
      # only on Windows CI. Key bindings stay macOS's. See
      # skills/burrow-cross-platform ("Testing wording").
      - name: Test (Windows wording)
        run: scripts/check.sh wording

  # Windows is a supported platform: the same checks (and, in the
  # windows-package job, a release build). Tests that need macOS are
  # cfg(target_os = "macos"); see "Keeping Windows building" in
  # site/src/dev/building.md.
  windows:
    name: Windows · fmt · clippy · test
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # scripts/check.sh, as on macOS, run by Git Bash.
      - name: Format
        shell: bash
        run: bash scripts/check.sh fmt

      - name: Clippy
        shell: bash
        run: bash scripts/check.sh clippy

      - name: Test
        shell: bash
        run: bash scripts/check.sh test

  # The release build packaged as the zip a release would attach (kept a
  # week, for testing a pull request on a real Windows machine). Its own job,
  # so it builds beside the checks instead of after them.
  windows-package:
    name: Windows · release build · package
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build (release)
        run: cargo build --release -p blyg-app --locked

      - name: Package
        shell: pwsh
        run: scripts/package-windows.ps1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ZIP_STEM }}
          path: |
            dist/${{ env.ZIP_STEM }}.zip
            dist/SHA256SUMS-windows
          if-no-files-found: error
          retention-days: 7

  # Tests come with the feature: a pull request that changes product code
  # (crates/*/src, not test files) must change tests too, unless a commit
  # has the trailer "No-test: <reason>". Cheap: git only, no build. The
  # order of commits (red tests first) is checked by the orchestrator with
  # scripts/test-first.sh --run before merging.
  test-first:
    name: tests with the change
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Product code changes come with tests
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/test-first.sh --pr "$BASE" "$HEAD"

  docs:
    name: docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The community extension list: format only (valid TOML, required
      # fields, names, https URLs, sorted). It never fetches or runs anything.
      - name: Check the community extension list
        run: scripts/check.sh extensions

      # The pinned mdBook; fails on mdBook errors or broken links.
      - name: Build the book
        run: scripts/check.sh docs
