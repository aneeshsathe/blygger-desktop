name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, Monday 06:00 UTC: RustSec advisories against main's lockfile
  # (only the changes and deny jobs do anything).
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  # The event is in the group so the weekly run can't cancel a push to main.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info in CI's dev/test builds: nothing reads it there, and it
  # costs compile and link time and cache size. Release builds are untouched.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Whether the Rust jobs run. A pull request that only adds or modifies
  # files in scripts/ci-skip.py's SKIP list (screenshots: nothing a test
  # reads) skips them; a deletion or rename there runs everything.
  # Skipped jobs show as skipped, which counts as passing. Pushes to main
  # always run everything. The check step fails if code reads a
  # SKIP path, so the list can't outgrow what's safe.
  # Branch protection: if this job fails, the Rust jobs are skipped, and a
  # skipped job counts as passing. "what changed" must be a required check
  # alongside them, or a broken decision lets a PR through untested.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
      deps: ${{ steps.decide.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Nothing reads a skippable path
        run: scripts/check.sh ci-skip

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-skip.py decide "$EVENT" ${BASE:+"$BASE" "$HEAD"}

  check:
    name: fmt · clippy · test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the channel and components; rustup installs it
      # on first use.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Main only: a pull request's caches can't be read by other pull
          # requests, and saving them pushed the release caches out of the
          # repo's 10 GB (pull requests restore main's).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Each step is one step of scripts/check.sh, the gate contributors run
      # locally (`scripts/check.sh --fix`), so the two can't drift.
      - name: Format
        run: scripts/check.sh fmt

      - name: Clippy
        run: scripts/check.sh clippy

      # Also fails when site/src/generated/ is out of date with the config
      # keys or the keymap (run scripts/gen-docs.sh).
      - name: Test
        run: scripts/check.sh test

      # blyg-app's tests again with every UI string spelled as Windows shows
      # it (Ctrl+B, not ⌘B): a test that expects Mac glyphs fails here, not
      # only on Windows CI. Key bindings stay macOS's. See
      # skills/burrow-cross-platform ("Testing wording").
      - name: Test (Windows wording)
        run: scripts/check.sh wording

  # The web app, built as the release builds it (release.yml attaches it
  # as Burrow-web-<version>.zip), so a break shows here, not at release.
  # Its own job, so it runs beside the tests instead of after them.
  web:
    name: web app (wasm-release)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # wasm-bindgen-cli is built from source once and kept in the cache
      # (it was ~1.5 min of every run).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-directories: ~/blyg-web-tools

      - name: Build the web app
        run: |
          brew list llvm >/dev/null 2>&1 || brew install llvm
          BLYG_WEB_TOOLS="$HOME/blyg-web-tools" ./crates/blyg-web/serve.sh --build-only

  # Windows is a supported platform: the same checks (and, in the
  # windows-package job, a release build). Tests that need macOS are
  # cfg(target_os = "macos"); see "Keeping Windows building" in
  # site/src/dev/building.md.
  windows:
    name: Windows · fmt · clippy · test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Main only: a pull request's caches can't be read by other pull
          # requests, and saving them pushed the release caches out of the
          # repo's 10 GB (pull requests restore main's).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # scripts/check.sh, as on macOS, run by Git Bash.
      - name: Format
        shell: bash
        run: bash scripts/check.sh fmt

      - name: Clippy
        shell: bash
        run: bash scripts/check.sh clippy

      - name: Test
        shell: bash
        run: bash scripts/check.sh test

  # The wall-clock timing reports (tests named timing_…, ignored with
  # "timing: run by the CI timing job"; their budgets go through
  # blyg_core::wait::Budget). A budget measures the runner as much as the
  # code, so this job reports and never blocks a merge: continue-on-error
  # keeps the run green, and its log holds the numbers. It builds the tests
  # in release, which is what the budgets mean (one extra build, on a job
  # that blocks nothing). macOS only: Windows timing isn't measured (the
  # budgets' 4x Windows factor is untested). Tests that guard an
  # algorithm count work instead, in the check job.
  timing:
    name: timing reports (never blocks)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Main only: a pull request's caches can't be read by other pull
          # requests, and saving them pushed the release caches out of the
          # repo's 10 GB (pull requests restore main's).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Timing reports
        run: scripts/check.sh timing

  # The release build packaged as the zip a release would attach (kept a
  # week, for testing a pull request on a real Windows machine). Its own job,
  # so it builds beside the checks instead of after them.
  windows-package:
    name: Windows · release build · package
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Main only: a pull request's caches can't be read by other pull
          # requests, and saving them pushed the release caches out of the
          # repo's 10 GB (pull requests restore main's).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build (release)
        run: cargo build --release -p blyg-app --locked

      - name: Package
        shell: pwsh
        run: scripts/package-windows.ps1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ZIP_STEM }}
          path: |
            dist/${{ env.ZIP_STEM }}.zip
            dist/SHA256SUMS-windows
          if-no-files-found: error
          retention-days: 7

  # After a push to main: keeps only the newest cache of each name and drops
  # closed pull requests' caches, so the total stays under GitHub's 10 GB and
  # the release workflow's caches (read once per release) aren't evicted.
  cache-prune:
    name: prune superseded caches
    needs: [check, windows, timing, windows-package]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/ci-cache-prune.sh

  # Tests come with the feature: a pull request that changes product code
  # (crates/*/src, not test files) must change tests too, unless a commit
  # has the trailer "No-test: <reason>". Cheap: git only, no build. The
  # order of commits (red tests first) is checked by the orchestrator with
  # scripts/test-first.sh --run before merging.
  test-first:
    name: tests with the change
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Product code changes come with tests
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/test-first.sh --pr "$BASE" "$HEAD"

  # Dependencies, by deny.toml. Bans, licences and sources on every run.
  # RustSec advisories on pushes to main, weekly, and on a PR that changes
  # Cargo.lock or deny.toml, so a new advisory doesn't fail unrelated PRs;
  # it fails the weekly run until it's fixed or listed with its reason.
  deny:
    name: dependencies (cargo deny)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # A prebuilt, checksum-verified cargo-deny release.
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deny@0.20.2

      - name: Bans, licences, sources
        run: scripts/check.sh deny-policy

      - name: Advisories
        if: needs.changes.outputs.deps == 'true'
        run: scripts/check.sh deny-advisories

  docs:
    name: docs site
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The community extension list: format only (valid TOML, required
      # fields, names, https URLs, sorted). It never fetches or runs anything.
      - name: Check the community extension list
        run: scripts/check.sh extensions

      # The pinned mdBook; fails on mdBook errors or broken links.
      - name: Build the book
        run: scripts/check.sh docs
