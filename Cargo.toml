[workspace]
resolver = "3"
members = ["crates/blyg-core", "crates/blyg-ai", "crates/blyg-render", "crates/blyg-ext", "crates/blyg-ext-notes", "crates/blyg-ext-crosspost", "crates/blyg-ext-reading-time", "crates/blyg-ext-inspect", "crates/blyg-embed", "crates/blyg-app"]

[workspace.package]
edition = "2024"
version = "0.27.1"
license = "MIT"
description = "A fast, local-first macOS studio for Blygger blogs"
# Placeholder repo; set it with scripts/set-repo.sh (see packaging/config.env).
repository = "https://github.com/aneeshsathe/blygger-desktop"
authors = ["Blygger Desktop contributors"]
keywords = ["blygger", "blog", "gpui", "macos", "writing"]

# Shared third-party versions (a crate opts in with `{ workspace = true }`).
[workspace.dependencies]
# Unicode on the wire (spec decision #103): NFC on save, grapheme-safe cuts,
# U-label display of an internationalized host.
unicode-normalization = "0.1"
unicode-segmentation = "1"
idna = "1"

# Lints every crate takes (`[lints] workspace = true` in each crate's
# Cargo.toml; `blyg-core/tests/it/crate_graph.rs` checks each one opts in).
[workspace.lints.rust]
# Unsafe code is reviewed where it lives: only blyg-app's platform glue
# (Cocoa, WebKit, Win32) needs it, and each item that does says why with
# `#[expect(unsafe_code, reason = "…")]`. Anywhere else it fails the build.
unsafe_code = "deny"
# `--cfg blygger_snap`: screenshot builds (RUSTFLAGS, scripts/browser-*-check.sh).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(blygger_snap)"] }

[workspace.lints.clippy]
# A lint is silenced with #[expect(lint, reason = "…")]: it says why, and
# fails once the code it excuses is gone. #[allow] is left for code where
# expect can't hold on every target or build (each one says why).
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2   # GPUI + sqlite are painfully slow unoptimised; our own code stays debuggable
# Line numbers in backtraces are enough for dependencies; full debug info for
# ~1000 crates at opt-level 2 costs link time and gigabytes of target/.
debug = "line-tables-only"
