[workspace]
resolver = "3"
members = ["crates/blyg-core", "crates/blyg-ai", "crates/blyg-render", "crates/blyg-ext", "crates/blyg-ext-notes", "crates/blyg-ext-crosspost", "crates/blyg-ext-reading-time", "crates/blyg-ext-inspect", "crates/blyg-app", "crates/blyg-web"]

[workspace.package]
edition = "2024"
version = "0.17.1"
license = "MIT"
description = "A fast, local-first macOS studio for Blygger blogs"
# Placeholder repo; set it with scripts/set-repo.sh (see packaging/config.env).
repository = "https://github.com/aneeshsathe/blygger-desktop"
homepage = "https://github.com/aneeshsathe/blygger-desktop"
authors = ["Blygger Desktop contributors"]
keywords = ["blygger", "blog", "gpui", "macos", "writing"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# blyg-web's WebAssembly build (crates/blyg-web/serve.sh): smallest code,
# whole-program LTO. Panics already abort on wasm32-unknown-unknown.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2   # GPUI + sqlite are painfully slow unoptimised; our own code stays debuggable
