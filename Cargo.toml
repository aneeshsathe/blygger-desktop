[workspace]
resolver = "3"
members = ["crates/blyg-core", "crates/blyg-ai", "crates/blyg-render", "crates/blyg-ext", "crates/blyg-ext-notes", "crates/blyg-ext-crosspost", "crates/blyg-ext-reading-time", "crates/blyg-ext-inspect", "crates/blyg-embed", "crates/blyg-app", "crates/blyg-web"]

[workspace.package]
edition = "2024"
version = "0.25.1"
license = "MIT"
description = "A fast, local-first macOS studio for Blygger blogs"
# Placeholder repo; set it with scripts/set-repo.sh (see packaging/config.env).
repository = "https://github.com/aneeshsathe/blygger-desktop"
authors = ["Blygger Desktop contributors"]
keywords = ["blygger", "blog", "gpui", "macos", "writing"]

# Shared third-party versions (a crate opts in with `{ workspace = true }`).
[workspace.dependencies]
# Unicode on the wire (spec decision #103): NFC on save, grapheme-safe cuts,
# U-label display of an internationalized host.
unicode-normalization = "0.1"
unicode-segmentation = "1"
idna = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# blyg-web's WebAssembly build (crates/blyg-web/serve.sh): smallest code,
# whole-program LTO. Panics already abort on wasm32-unknown-unknown.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Local web iteration only (`DEV=1 ./crates/blyg-web/serve.sh`): no LTO,
# parallel and incremental codegen. A larger, slower wasm; never shipped.
# CI and releases build wasm-release.
[profile.wasm-dev]
inherits = "wasm-release"
opt-level = 1
lto = false
codegen-units = 256
incremental = true
strip = false

[profile.dev.package."*"]
opt-level = 2   # GPUI + sqlite are painfully slow unoptimised; our own code stays debuggable
# Line numbers in backtraces are enough for dependencies; full debug info for
# ~1000 crates at opt-level 2 costs link time and gigabytes of target/.
debug = "line-tables-only"
