# Contract coverage: what in openapi-current.json no test names, and why.
# Checked by tests/it/contract_coverage.rs; see README.md beside this file.

# The studio Burrow targets. A studio sync starts here: copy that studio's
# openapi.json over openapi-current.json, move this pair (and the docs that
# name it), then write the tests the coverage check lists, then build.
[target]
studio = "0.69.0"
contract = "6.2.0"

# Items Burrow doesn't use, one reason each ("Burrow doesn't use X because …").
# An entry fails once a test names the item.
# [[exempt]]
# item = "operation:someOperation"
# reason = "Burrow doesn't use X because …"

[[exempt]]
item = "param:*/header:if-none-match"
reason = "Sent by api::conditional on every kept-ETag GET; e2e/conditional.rs shows it only by the 304s it earns, never naming the header (wanted: the Shim asserting requests carry If-None-Match)"

[[exempt]]
item = "property:batchRead/request.requests[].ifNoneMatch"
reason = "Sent by api::read_batch for children with a kept ETag; e2e/conditional.rs a_read_batch_child_304_hands_back_its_body shows it only by the child's 304 (wanted: a check on the request body's ifNoneMatch)"

# Items a work package is building. Reported as a warning while no test
# names them; a failure once one does, so delete the entry then.
# [[pending]]
# item = "header:*:ETag"
# pending = "WP8 wp8-studio-065"
# --- 0.28.0 wave A (sync, syndication, reader wire): add entries below this line only ---
[[exempt]]
item = "enum:*/query:raw=true"
reason = "The raw parameter's one value. Burrow doesn't send raw=true (GET /reading, /reading/summary): it holds the whole imported list from GET /reading/imported, which is already raw (no Background rule, placement or fold, withdrawn rows included), and its Raw tab is that list, newest first (reading/feed.rs raw_order). param:*/query:raw has no entry only because the matcher counts it as covered: tests hold the tab's label \"Raw\" (any case matches). That is a false cover: no test sends the parameter"

# --- 0.28.0 wave B (reading tabs, Background rules, readerOrder): add entries below this line only ---

[[exempt]]
item = "param:listReading/query:order"
reason = "Burrow orders the Feed itself (blyg_core::pace, a port of the studio's paceLayeredOrder over the local reading list; reading/feed.rs), so it never asks /reading for an order: the list it syncs is the same whichever order the owner chose"

# --- 0.28.0 wave C (rendering, mentions, picker): add entries below this line only ---

