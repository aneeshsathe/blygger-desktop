[package]
name = "blyg-core"
publish = false
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["keychain"]
# Real OS token storage: the macOS Keychain, or Windows Credential Manager.
# Tests never construct `KeychainTokenStore`.
keychain = ["dep:keyring"]
# Test-only hooks (`Store::count_work`): enabled only in a crate's
# [dev-dependencies] (blyg-core's own, below; blyg-app's), never in
# [dependencies] (`tests/it/crate_graph.rs`).
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
ureq = { version = "2.12", default-features = false, features = ["tls", "json", "gzip", "brotli"] }
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
toml = "1"
url = "2"
unicode-normalization = { workspace = true }
unicode-segmentation = { workspace = true }
idna = { workspace = true }
keyring = { version = "3.6", features = ["apple-native", "windows-native"], optional = true }
# The studio's code ranges (`tk::parse`: TK tokens in code are text).
blyg-render = { path = "../blyg-render" }

[dev-dependencies]
# Its own test-support feature, for the integration tests (tests/perf.rs).
blyg-core = { path = ".", features = ["test-support"] }
tempfile = "3"
# Gzip bodies for the compressed-response tests (ureq already links it).
flate2 = "1"
# Model-based tests of the reading walk (sync/walk_model_tests.rs); the
# workspace already links it through gpui.
proptest = "1.11"

[lints]
workspace = true
