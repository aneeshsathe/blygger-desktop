# Clippy reads this file for blyg-embed only (the crate's own directory wins).
# `cargo clippy --workspace --all-targets -- -D warnings` (the gate and CI)
# fails on any use of these.

disallowed-methods = [
    # Fixed sleeps that "let something finish" pass on an idle machine and
    # fail under load. blyg-embed is a leaf (the embedding model and its
    # one-time download: nothing in it waits) and can't reach blyg_core::wait.
    { path = "std::thread::sleep", reason = "embedding never waits; a test checks a result, not a moment (if a wait is ever needed, poll a condition with a deadline, as blyg_core::wait::until does)" },
]
