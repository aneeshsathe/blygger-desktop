# Clippy reads this file for blyg-ext only (the crate's own directory wins).
# `cargo clippy --workspace --all-targets -- -D warnings` (the gate and CI)
# fails on any use of these.

disallowed-methods = [
    # Fixed sleeps that "let something finish" pass on an idle machine and
    # fail under load. The one reviewed sleep is in blyg-core's `wait`.
    { path = "std::thread::sleep", reason = "use blyg_core::wait (re-exported as blyg_ext::wait): tests wait with until / poll_until (wall_clock only when the code under test measures time); production pauses with pace / nap / poll_until" },
]

disallowed-types = [
    # Spawning a process is a review item for outside contributions: a new
    # spawn site fails here until its module says why it needs one.
    { path = "std::process::Command", reason = "process spawning is reviewed: put it in a module that already spawns (or add #[expect(clippy::disallowed_types, reason = \"…\")] on the item that needs it)" },
]
