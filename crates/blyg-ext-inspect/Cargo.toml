[package]
name = "blyg-ext-inspect"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "inspect: Burrow's bundled extension that shows the record Burrow holds for a reading entry (ids, versions, references, hashes) and its JSON"

[dependencies]
blyg-ext = { path = "../blyg-ext" }
serde_json = "1"

[dev-dependencies]
# A real reading row, for the round trip.
blyg-core = { path = "../blyg-core", default-features = false }
